<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GOLYBRAND Admin</title><link rel="stylesheet" href="admin.css"></head><body><main id="adminApp"><section id="loginView" class="card auth"><div class="brand-logo">GA</div><h1>GOLYBRAND ADMIN</h1><p>Administrator control panel</p><div id="loginMsg"></div><div id="loginForm"><form onsubmit="adminLogin(event)"><label>Username</label><input id="adminUser" required><label>Password</label><input id="adminPass" type="password" required><button>Login</button></form><button type="button" class="link-button" onclick="showAdminRegister()">Register New Admin</button></div><div id="registerForm" class="hidden"><form onsubmit="adminRegister(event)"><label>Admin Username</label><input id="regAdminUser" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+"><label>Password</label><input id="regAdminPass" type="password" required minlength="8"><label>Confirm Password</label><input id="regAdminConfirm" type="password" required minlength="8"><label>Admin Registration Key</label><input id="regAdminKey" type="password" required><small class="help">Use the setup key configured in backend/config.php.</small><button type="submit">Create Admin Account</button></form><button type="button" class="link-button" onclick="showAdminLogin()">← Back to Admin Login</button></div></section><section id="panel" class="hidden"><header><div><strong>GOLYBRAND ADMIN</strong><span> Control Center</span></div><button class="secondary" onclick="adminLogout()">Logout</button></header><div class="stats" id="stats"></div><nav><button onclick="loadAll()">All Users</button><button onclick="loadPending()">Pending Activations</button><button onclick="loadWithdrawals()">Withdrawals</button><button onclick="showContentManager()">Manage Content</button></nav><section class="card"><div class="section-head"><h2 id="title">Pending Activations</h2><button class="secondary" onclick="refreshCurrent()">Refresh</button></div><div id="table"></div></section><section id="contentManager" class="card hidden"><div class="section-head"><h2>Content Manager</h2><button class="secondary" onclick="hideContentManager()">Close</button></div><div class="content-tabs"><button onclick="loadContent('trivia')">Trivia Questions</button><button onclick="loadContent('forex')">Forex Classes</button><button onclick="loadContent('ebook')">E-books</button><button onclick="loadContent('tiktok')">TikTok Videos</button><button onclick="loadContent('award')">Best Agent Awards</button></div><div id="contentEditor"></div><div id="contentTable"></div></section></section></main><script src="admin.js"></script></body></html>
